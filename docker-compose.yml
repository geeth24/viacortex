services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "80:80" # HTTP port for proxy
      - "443:443" # HTTPS port for proxy
      - "8080:8080" # Admin API port
      - "25565:25565" # Minecraft TCP proxy port
    volumes:
      - ./server:/app
      - go-modules:/go/pkg/mod
      - ssl-certs:/root/.local/share/certmagic # For SSL certificate storage
    env_file:
      - .env
    depends_on:
      - db
    command: air
    cap_add:
      - NET_BIND_SERVICE # Required to bind to ports 80 and 443

  client:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./client:/app
      - client-node-modules:/app/node_modules
    environment:
      - API_URL=http://server:8080
      - BACKEND_URL=http://server:8080
    command: sh -c "npm install && npm run dev"
    depends_on:
      - server

  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=viacortex
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  go-modules:
  ssl-certs:
  postgres_data:
  client-node-modules:
