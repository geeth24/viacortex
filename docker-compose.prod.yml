services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile.prod
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - ssl-certs:/root/.local/share/certmagic
    env_file:
      - .env
    depends_on:
      - db
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://server:8080
    depends_on:
      - server
    restart: unless-stopped

  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=viacortex
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  ssl-certs:
  postgres_data:
